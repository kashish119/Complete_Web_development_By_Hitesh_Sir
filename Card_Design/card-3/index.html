<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="date">
                  Dec 17, 2024
                </div>
                <div class="group-menu">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <div class="card-body">
                <h3>Web Designing</h3>
                <p>Prototyping</p>
                <!-- <div class="progress">
                  <span>Progress</span>
                  <div class="progress-bar"></div>
                  <span>90%</span>
                </div> -->
                <div class="progress">
                    <span>Progress</span>
                    <div class="progress-bar">
                      <div class="progress-fill"></div>
                    </div>
                    <span id="percent">90%</span>
                  </div>
            </div>

            <hr class="line">

            <div class="card-footer">
                <div class="image">
                    <img src="https://images.pexels.com/photos/614810/pexels-photo-614810.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="person">
                    <img src="https://images.pexels.com/photos/874158/pexels-photo-874158.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="person">
                    <img src="plus.svg" alt="plus-sign" id="plus">
                </div>
                <button>3 days left</button>
            </div>
        </div>
    </div>
</body>
</html>
