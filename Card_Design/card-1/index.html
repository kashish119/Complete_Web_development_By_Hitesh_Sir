<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <link rel="stylesheet" href="card1.css" />
  </head>
  <body>
    <div class="card">
      <h1>Marketing Conference 2024</h1>
      <div class="details">
        <div>
          <p>Start Time</p>
          <div class="time">27<sup>th</sup> December, 2:00 PM</div>
        </div>
        <div>
          <p>End Time</p>
          <div class="time">28<sup>th</sup> December, 12:00 PM</div>
        </div>
      </div>

      <div class="buttons">
        <button class="register">Register</button>
        <button class="calendar">
            <i class="fa-solid fa-calendar"></i>
            <i class="fa-regular fa-calendar-days"></i> Add to Calendar
        </button>
      </div>

    </div>
  </body>
</html>
