<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card4.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-6eXyq/f8O/SRFPm2PRWEuY/w+kOFu7CEhIR6bfXHzHH4bT28WTULS1+NpIC95NEm" crossorigin="anonymous"> 
    
    <i class="fa-solid fa-check">
    -->
</head>
<body>
    <div class="container">
       <div class="pricing-card card-1">
            <h3 class="start">Starter</h3>
            <span>Free</span>
            <ul>
                <li>
                    <span>&check;</span>Unlimited files
                </li>
                <li>
                    <span>&check;</span>Unlimited editors
                </li>
                <li>
                    <span>&check;</span>Unlimited cloud storage
                </li>
            </ul>
            <button class="starter">Choose Starter</button>
       </div>

       <div class="pricing-card card-2">
            <h3 class="professional">Professional</h3>
            <p> <span>&dollar;12 </span>per member</p>
            <ul>
                <li>
                    <span>&check;</span>Unlimited projects
                </li>
                <li>
                    <span>&check;</span>Private projects
                </li>
                <li>
                    <span>&check;</span>Team libraries
                </li>
            </ul>
            <button class="professional-btn">Choose Professional</button>
       </div>
    </div>
</body>
</html>
